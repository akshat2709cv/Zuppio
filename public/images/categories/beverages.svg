<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Beverages category</title>
  <desc id="desc">Two colorful beverage bottles for future ZUPPIO drinks.</desc>
  <defs>
    <linearGradient id="blueBottle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7efff0"/>
      <stop offset="1" stop-color="#22c6d8"/>
    </linearGradient>
    <linearGradient id="orangeBottle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd74d"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#128a8f" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="330" rx="170" ry="30" fill="#45cdbd" opacity=".16"/>
    <g transform="translate(218 58)">
      <rect x="0" y="56" width="100" height="232" rx="32" fill="url(#blueBottle)"/>
      <rect x="26" y="10" width="48" height="60" rx="14" fill="#eaffff"/>
      <rect x="19" y="132" width="62" height="64" rx="18" fill="#111820" opacity=".86"/>
      <path d="M36 164h28" stroke="#ffcf2e" stroke-width="8" stroke-linecap="round"/>
      <path d="M12 88h76" stroke="#fff" stroke-width="10" opacity=".28"/>
    </g>
    <g transform="translate(332 58)">
      <rect x="0" y="56" width="100" height="232" rx="32" fill="url(#orangeBottle)"/>
      <rect x="26" y="10" width="48" height="60" rx="14" fill="#fff7df"/>
      <rect x="19" y="132" width="62" height="64" rx="18" fill="#111820" opacity=".86"/>
      <path d="M36 164h28" stroke="#2fd5c4" stroke-width="8" stroke-linecap="round"/>
      <path d="M12 88h76" stroke="#fff" stroke-width="10" opacity=".28"/>
    </g>
    <path d="M142 182c30-16 60-17 88-4" fill="none" stroke="#8fdcc6" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <path d="M452 204c22-14 45-17 68-7" fill="none" stroke="#8fdcc6" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  </g>

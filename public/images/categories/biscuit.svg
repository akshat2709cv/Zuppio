<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Biscuit category</title>
  <desc id="desc">A stack of golden biscuits with crumbs.</desc>
  <defs>
    <linearGradient id="biscuit" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7c16a"/>
      <stop offset="1" stop-color="#b86d2e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#7a3e10" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="320" rx="160" ry="28" fill="#c37b31" opacity=".16"/>
    <g transform="translate(230 88)">
      <g fill="url(#biscuit)" stroke="#8c4b1c" stroke-width="5">
        <rect x="15" y="148" width="205" height="74" rx="18" transform="rotate(-3 118 185)"/>
        <rect x="0" y="104" width="205" height="74" rx="18" transform="rotate(4 102 141)"/>
        <rect x="18" y="58" width="205" height="74" rx="18" transform="rotate(-5 120 95)"/>
        <rect x="0" y="14" width="205" height="74" rx="18" transform="rotate(5 102 51)"/>
      </g>
      <g fill="#7f3f17" opacity=".55">
        <circle cx="52" cy="48" r="5"/><circle cx="98" cy="36" r="4"/><circle cx="152" cy="60" r="5"/>
        <circle cx="64" cy="94" r="4"/><circle cx="128" cy="92" r="5"/><circle cx="180" cy="108" r="4"/>
      </g>
    </g>
    <g fill="#bd7a35" opacity=".75">
      <circle cx="444" cy="284" r="10"/><circle cx="476" cy="302" r="7"/><circle cx="190" cy="306" r="8"/><circle cx="492" cy="264" r="5"/>
    </g>
  </g>
